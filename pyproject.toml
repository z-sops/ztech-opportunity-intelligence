[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ztech-opportunity-intelligence"
version = "1.0.0"
description = "ZTech Competitive & Opportunity Intelligence Engine — standalone Python core with MCP adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "selectolax>=1.0",
  "defusedxml>=0.7",
  "mcp>=2.0",
]

[project.optional-dependencies]
rest = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ztech-oi = "ztech_oi.adapters.cli:main"
ztech-oi-mcp = "ztech_oi.adapters.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S311", "B008", "UP040", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501", "ASYNC"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
